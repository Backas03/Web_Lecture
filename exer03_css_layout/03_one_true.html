<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            width: 500px;
            margin: 10px auto;
        }

        #middle {
            overflow: hidden;
        }

        #left {
            float: left;
            width: 150px;
            background: red;
        }

        #right {
            float: right;
            width: 350px;
            background: blue;
        }
        
        #top {
            background: green;
        }
        
        #bottom {
            background: purple;
        }
    </style>
</head>
<body>
    <div id="top">
        eque porro quisquam est qui dolorem.
    </div>

    <div id="middle">
        <div id="left">
            eque porro quisquam est qui dolorem.
        </div>
        <div id="right">
            eque porro quisquam est qui dolorem.
        </div>
    </div>

    <div id="bottom">
        eque porro quisquam est qui dolorem.
    </div>
</body>
</html>
